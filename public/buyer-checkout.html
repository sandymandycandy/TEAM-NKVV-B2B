<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout - VendorConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
  <style>
    /* Styles for the modal */
    .modal {
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: #fefefe;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      text-align: center;
    }
    .modal-content.success {
      background-color: #d1e7dd;
      color: #0f5132;
    }
    .modal-content.error {
      background-color: #f8d7da;
      color: #842029;
    }
  </style>
</head>
<body class="bg-gray-100 font-[Inter]">
  <!-- Message Modal -->
  <div id="message-modal" class="modal">
    <div id="message-modal-content" class="modal-content">
      <p id="modal-message"></p>
      <button class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-md" onclick="closeModal()">Close</button>
    </div>
  </div>

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r p-6">
      <h2 class="text-2xl font-bold text-teal-600">Dashboard</h2>
      <p class="text-sm text-gray-500 mb-8">Buyer</p>
      <nav class="space-y-4">
        <a href="/buyer-dashboard" class="flex items-center gap-2 text-gray-700 hover:text-blue-600">🏠 Home</a>
        <a href="/buyer/products" class="flex items-center gap-2 text-gray-700 hover:text-blue-600">📦 Products Listing</a>
        <a href="/buyer/cart" class="flex items-center gap-2 text-gray-700 hover:text-blue-600">🛒 My Cart</a>
        <a href="/buyer/profile" class="flex items-center gap-2 text-gray-700 hover:text-blue-600">👤 Profile</a>
        <a href="/buyer/history" class="flex items-center gap-2 text-gray-700 hover:text-blue-600">📥 History</a>
        <a href="/buyer/chat" class="flex items-center gap-2 text-gray-700 hover:text-blue-600">💬 Chat</a>
      </nav>
    </aside>

    <!-- Checkout Content -->
    <main class="flex-1 p-8 space-y-8">
      <h1 class="text-2xl font-bold text-gray-800 mb-4">Checkout</h1>

      <!-- Cart Summary -->
      <div class="bg-white p-6 rounded-xl shadow space-y-4">
        <h2 class="text-lg font-semibold">Order Summary</h2>
        <div id="checkout-cart" class="space-y-3"></div>
        <div class="text-right text-xl font-bold mt-4" id="checkout-total">Total: ₹0</div>
      </div>

      <!-- Delivery Details -->
      <div class="bg-white p-6 rounded-xl shadow space-y-4">
        <h2 class="text-lg font-semibold">Delivery Address</h2>
        <textarea id="deliveryAddress" rows="3" class="w-full border rounded px-3 py-2 text-gray-700"></textarea>
      </div>

      <!-- Payment Method -->
      <div class="bg-white p-6 rounded-xl shadow space-y-4">
        <h2 class="text-lg font-semibold">Payment Method</h2>
        <select id="paymentMethod" class="w-full border rounded px-3 py-2 text-gray-700">
          <option value="COD">Cash on Delivery</option>
          <option value="UPI">UPI</option>
          <option value="Card">Credit/Debit Card</option>
        </select>
      </div>

      <!-- Proceed Button -->
      <button onclick="placeOrder()" class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-lg shadow text-lg font-semibold">
        Proceed to Payment
      </button>
    </main>
  </div>

<script>
  // Message Modal Functions
  const modal = document.getElementById('message-modal');
  const modalMessage = document.getElementById('modal-message');
  const modalContent = document.getElementById('message-modal-content');

  function showModal(message, type) {
      modalMessage.textContent = message;
      modalContent.className = 'modal-content ' + type;
      modal.style.display = 'flex';
  }

  function closeModal() {
      modal.style.display = 'none';
  }

  async function loadCheckoutCart() {
    const token = localStorage.getItem('token');
    if (!token) {
      showModal('Please log in first.', 'error');
      setTimeout(() => window.location.href = '/login', 2000);
      return;
    }

    try {
      const res = await fetch('/api/buyer/cart', {
        headers: { 'x-auth-token': token }
      });
      const data = await res.json();

      const cartDiv = document.getElementById('checkout-cart');
      const totalDiv = document.getElementById('checkout-total');

      if (res.ok && data.success && data.data.length > 0) {
        cartDiv.innerHTML = '';
        let total = 0;

        data.data.forEach(item => {
          if (!item.productId) return;

          const subtotal = item.subtotal || (item.productId.price * item.quantity);
          total += subtotal;

          const row = document.createElement('div');
          row.className = 'flex justify-between items-center border-b pb-2';
          row.innerHTML = `
            <div>
              <p class="font-semibold">${item.productId.name}</p>
              <p class="text-sm text-gray-600">Qty: ${item.quantity} × ₹${item.productId.price}</p>
            </div>
            <p class="font-semibold">₹${subtotal.toFixed(2)}</p>
          `;
          cartDiv.appendChild(row);
        });

        totalDiv.innerText = `Total: ₹${total.toFixed(2)}`;
      } else {
        cartDiv.innerHTML = '<p class="text-gray-500">Your cart is empty.</p>';
        totalDiv.innerText = 'Total: ₹0';
      }
    } catch (err) {
      console.error('Error loading checkout cart:', err);
    }
  }

  async function placeOrder() {
    const token = localStorage.getItem('token');
    if (!token) {
      showModal('Please log in first.', 'error');
      setTimeout(() => window.location.href = '/login', 2000);
      return;
    }

    const address = document.getElementById('deliveryAddress').value.trim();
    const paymentMethod = document.getElementById('paymentMethod').value;

    if (!address) {
      showModal('Please enter your delivery address.', 'error');
      return;
    }

    try {
      const res = await fetch('/api/buyer/orders', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-auth-token': token
        },
        body: JSON.stringify({ deliveryAddress: address, paymentMethod })
      });

      const data = await res.json();
      if (res.ok && data.success) {
        showModal('Order placed successfully!', 'success');
        setTimeout(() => {
          window.location.href = '/buyer/history';
        }, 1500);
      } else {
        showModal('Failed to place order: ' + (data.message || 'Unknown error'), 'error');
      }
    } catch (err) {
      console.error('Error placing order:', err);
      showModal('Error placing order.', 'error');
    }
  }

  document.addEventListener('DOMContentLoaded', loadCheckoutCart);
</script>
</body>
</html>
