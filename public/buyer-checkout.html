<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - VendorConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Styles for the modal */
    .modal {
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #fefefe;
      padding: 24px;
      border-radius: 16px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      transform: scale(0.95);
      transition: transform 0.2s;
    }

    .modal.show .modal-content {
      transform: scale(1);
    }

    .modal-content.success {
      border-left: 4px solid #10b981;
    }

    .modal-content.error {
      border-left: 4px solid #ef4444;
    }
  </style>
</head>

<body class="bg-gray-50 font-sans text-gray-900">
  <!-- Message Modal -->
  <div id="message-modal" class="modal">
    <div id="message-modal-content" class="modal-content">
      <h3 id="modal-title" class="text-lg font-bold mb-2">Notification</h3>
      <p id="modal-message" class="text-gray-600 mb-6"></p>
      <button
        class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 px-4 rounded-lg transition-colors"
        onclick="closeModal()">Close</button>
    </div>
  </div>

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside
      class="w-64 bg-white border-r border-gray-200 flex flex-col fixed h-full z-10 transition-transform duration-300 ease-in-out transform -translate-x-full md:translate-x-0"
      id="sidebar">
      <div class="p-6 border-b border-gray-100">
        <h1 class="text-2xl font-bold text-brand-600 tracking-tight">DASHBOARD</h1>
        <p class="text-sm text-gray-500 mt-1">Buyer Portal</p>
      </div>

      <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
        <a href="/buyer-dashboard"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">🏠</span> Home
        </a>
        <a href="/buyer/products"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">📦</span> Products Listing
        </a>
        <a href="/buyer/cart"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">🛒</span> My Cart
        </a>
        <a href="/buyer/profile"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">👤</span> Profile
        </a>
        <a href="/buyer/history"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">📥</span> History
        </a>
        <a href="/buyer/chat"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">💬</span> Chat
        </a>
      </nav>

      <div class="p-4 border-t border-gray-100">
        <button id="logout-btn"
          class="w-full flex items-center justify-center px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 hover:text-red-700 rounded-lg font-medium transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Log Out
        </button>
      </div>
    </aside>

    <!-- Checkout Content -->
    <main class="flex-1 md:ml-64 p-8 transition-all duration-300">
      <h1 class="text-2xl font-bold text-gray-800 mb-8">Checkout</h1>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Left Column: Forms -->
        <div class="lg:col-span-2 space-y-8">

          <!-- Delivery Details -->
          <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
              <span class="bg-brand-100 text-brand-600 p-2 rounded-lg mr-3 text-xl">📍</span> Delivery Address
            </h2>
            <textarea id="deliveryAddress" rows="3"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all"
              placeholder="Enter your full delivery address here..."></textarea>
          </div>

          <!-- Payment Method -->
          <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
              <span class="bg-green-100 text-green-600 p-2 rounded-lg mr-3 text-xl">💳</span> Payment Method
            </h2>
            <div class="space-y-3">
              <label
                class="flex items-center p-4 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                <input type="radio" name="paymentMethod" value="COD"
                  class="h-5 w-5 text-brand-600 focus:ring-brand-500 border-gray-300" checked>
                <div class="ml-3">
                  <span class="block text-sm font-medium text-gray-900">Cash on Delivery</span>
                  <span class="block text-sm text-gray-500">Pay when you receive your order</span>
                </div>
              </label>
              <label
                class="flex items-center p-4 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                <input type="radio" name="paymentMethod" value="UPI"
                  class="h-5 w-5 text-brand-600 focus:ring-brand-500 border-gray-300">
                <div class="ml-3">
                  <span class="block text-sm font-medium text-gray-900">UPI</span>
                  <span class="block text-sm text-gray-500">Google Pay, PhonePe, Paytm</span>
                </div>
              </label>
              <label
                class="flex items-center p-4 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                <input type="radio" name="paymentMethod" value="Card"
                  class="h-5 w-5 text-brand-600 focus:ring-brand-500 border-gray-300">
                <div class="ml-3">
                  <span class="block text-sm font-medium text-gray-900">Credit / Debit Card</span>
                  <span class="block text-sm text-gray-500">Visa, Mastercard, RuPay</span>
                </div>
              </label>
            </div>
          </div>
        </div>

        <!-- Right Column: Order Summary -->
        <div class="lg:col-span-1">
          <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 sticky top-8">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">Order Summary</h2>
            <div id="checkout-cart" class="space-y-4 mb-6 max-h-80 overflow-y-auto pr-2 custom-scrollbar">
              <!-- Cart items injected here -->
              <div class="animate-pulse space-y-3">
                <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                <div class="h-4 bg-gray-200 rounded w-1/2"></div>
              </div>
            </div>

            <div class="border-t border-gray-100 pt-4 space-y-2">
              <div class="flex justify-between text-sm text-gray-600">
                <span>Subtotal</span>
                <span id="subtotal-display">₹0.00</span>
              </div>
              <div class="flex justify-between text-sm text-gray-600">
                <span>Delivery Fee</span>
                <span class="text-green-600">Free</span>
              </div>
              <div class="flex justify-between text-lg font-bold text-gray-900 pt-2 border-t border-gray-100 mt-2">
                <span>Total</span>
                <span id="checkout-total">₹0.00</span>
              </div>
            </div>

            <button onclick="placeOrder()"
              class="w-full mt-6 bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-brand-200 transform hover:-translate-y-0.5 transition-all duration-200">
              Place Order
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Message Modal Functions
    const modal = document.getElementById('message-modal');
    const modalMessage = document.getElementById('modal-message');
    const modalTitle = document.getElementById('modal-title');
    const modalContent = document.getElementById('message-modal-content');

    function showModal(message, type) {
      modalMessage.textContent = message;
      if (type === 'success') {
        modalTitle.textContent = 'Success';
        modalTitle.className = 'text-lg font-bold mb-2 text-green-600';
        modalContent.className = 'modal-content success';
      } else {
        modalTitle.textContent = 'Error';
        modalTitle.className = 'text-lg font-bold mb-2 text-red-600';
        modalContent.className = 'modal-content error';
      }
      modal.style.display = 'flex';
      setTimeout(() => {
        modal.classList.add('show');
      }, 10);
    }

    function closeModal() {
      modal.classList.remove('show');
      setTimeout(() => {
        modal.style.display = 'none';
      }, 200);
    }

    async function loadCheckoutCart() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login';
        return;
      }

      try {
        const res = await fetch('/api/buyer/cart', {
          headers: { 'x-auth-token': token }
        });

        let data;
        if (res.ok) {
          data = await res.json();
        } else {
          console.error('API failed');
        }

        const cartDiv = document.getElementById('checkout-cart');
        const totalDiv = document.getElementById('checkout-total');
        const subtotalDiv = document.getElementById('subtotal-display');

        if (data && data.success && data.data.length > 0) {
          cartDiv.innerHTML = '';
          let total = 0;

          data.data.forEach(item => {
            if (!item.productId) return;

            const subtotal = item.subtotal || (item.productId.price * item.quantity);
            total += subtotal;

            const row = document.createElement('div');
            row.className = 'flex justify-between items-start';
            row.innerHTML = `
            <div>
              <p class="text-sm font-medium text-gray-800">${item.productId.name}</p>
              <p class="text-xs text-gray-500">Qty: ${item.quantity} × ₹${item.productId.price}</p>
            </div>
            <p class="text-sm font-semibold text-gray-700">₹${subtotal.toFixed(2)}</p>
          `;
            cartDiv.appendChild(row);
          });

          totalDiv.innerText = `₹${total.toFixed(2)}`;
          subtotalDiv.innerText = `₹${total.toFixed(2)}`;
        } else {
          cartDiv.innerHTML = '<p class="text-gray-500 text-center py-4">Your cart is empty.</p>';
          totalDiv.innerText = '₹0.00';
          subtotalDiv.innerText = '₹0.00';
        }
      } catch (err) {
        console.error('Error loading checkout cart:', err);
      }
    }

    async function placeOrder() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login';
        return;
      }

      const address = document.getElementById('deliveryAddress').value.trim();
      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

      if (!address) {
        showModal('Please enter your delivery address.', 'error');
        return;
      }

      try {
        const res = await fetch('/api/buyer/orders', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-auth-token': token
          },
          body: JSON.stringify({ deliveryAddress: address, paymentMethod })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          showModal('Order placed successfully!', 'success');
          setTimeout(() => {
            window.location.href = '/buyer/history';
          }, 1500);
        } else {
          showModal('Failed to place order: ' + (data.message || 'Unknown error'), 'error');
        }
      } catch (err) {
        console.error('Error placing order:', err);
        showModal('Error placing order.', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadCheckoutCart);

    // Logout functionality
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = '/login';
    });
  </script>
</body>

</html>
