<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScubeG Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Michroma&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Michroma', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-image: url('https://uploads.onecompiler.io/43rrvywxn/43rrvxhs2/Screenshot_25-7-2025_134332_www.designevo.com.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .glass-panel {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>

<body class="h-screen w-full flex items-center justify-center overflow-hidden">

  <div
    class="glass-panel w-full max-w-md p-8 rounded-2xl shadow-2xl mx-4 transform transition-all hover:scale-[1.01] duration-300">
    <div class="flex justify-center mb-6">
      <img src="https://uploads.onecompiler.io/43rrvywxn/43rrvxhs2/Screenshot_25-7-2025_135128_www.designevo.com.jpeg"
        alt="ScubeG Logo" class="w-20 h-20 rounded-full shadow-lg border-2 border-brand-500/30">
    </div>

    <h2 class="text-center text-3xl font-bold text-white mb-2 font-display">Welcome to <span
        class="text-brand-400">ScubeG</span></h2>
    <p class="text-center text-gray-400 mb-8 text-sm">Sign in to access your dashboard</p>

    <form id="login-form" class="space-y-5">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email Address</label>
        <input id="email" type="email" placeholder="you@example.com" required
          class="w-full px-4 py-3 rounded-lg bg-gray-800/50 border border-gray-600 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
        <input id="password" type="password" placeholder="••••••••" required
          class="w-full px-4 py-3 rounded-lg bg-gray-800/50 border border-gray-600 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200">
      </div>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center text-gray-300 cursor-pointer group">
          <input type="checkbox"
            class="w-4 h-4 rounded border-gray-600 text-brand-600 focus:ring-brand-500 bg-gray-700">
          <span class="ml-2 group-hover:text-white transition-colors">Remember me</span>
        </label>
        <a href="#" class="text-brand-400 hover:text-brand-300 transition-colors">Forgot password?</a>
      </div>

      <button type="submit"
        class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-brand-500/30 hover:shadow-brand-500/50 transform hover:-translate-y-0.5 transition-all duration-200">
        Sign In
      </button>
    </form>

    <!-- Message box -->
    <div id="message-box" class="mt-4 p-3 rounded-lg text-center text-sm hidden transition-all duration-300"></div>

    <div class="mt-8 text-center text-sm text-gray-400">
      Don’t have an account? <a href="/signup"
        class="text-brand-400 hover:text-brand-300 font-medium transition-colors">Sign up</a>
    </div>
  </div>

  <script>
    document.querySelector('form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.querySelector('#email').value;
      const password = document.querySelector('#password').value;
      const messageBox = document.getElementById('message-box');
      const submitBtn = document.querySelector('button[type="submit"]');

      // Function to show a message in the message box
      function showMessage(message, type) {
        messageBox.textContent = message;
        messageBox.classList.remove('hidden', 'bg-red-500/20', 'text-red-200', 'bg-green-500/20', 'text-green-200');

        if (type === 'error') {
          messageBox.classList.add('bg-red-500/20', 'text-red-200', 'border', 'border-red-500/30');
        } else {
          messageBox.classList.add('bg-green-500/20', 'text-green-200', 'border', 'border-green-500/30');
        }
        messageBox.classList.remove('hidden');
      }

      // Hide message box on new submission
      messageBox.classList.add('hidden');

      // Loading state
      const originalBtnText = submitBtn.textContent;
      submitBtn.textContent = 'Signing in...';
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (result.success) {
          // Save token and role in localStorage for later API calls
          localStorage.setItem('token', result.token);
          localStorage.setItem('userRole', result.role);

          // Redirect based on role
          window.location.href = result.redirectTo.replace('.html', '');
        } else {
          showMessage(result.message || 'Login failed.', "error");
          submitBtn.textContent = originalBtnText;
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        }
      } catch (error) {
        console.error('Network or server error:', error);
        showMessage('An unexpected error occurred. Please try again.', "error");
        submitBtn.textContent = originalBtnText;
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
      }
    });
  </script>

</body>

</html>
