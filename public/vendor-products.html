<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Styles for the modal */
    .modal {
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #fefefe;
      padding: 24px;
      border-radius: 16px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      transform: scale(0.95);
      transition: transform 0.2s;
    }

    .modal.show .modal-content {
      transform: scale(1);
    }

    .modal-content.success {
      border-left: 4px solid #10b981;
    }

    .modal-content.error {
      border-left: 4px solid #ef4444;
    }

    .modal-content .confirm-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body class="bg-gray-50 font-sans text-gray-900">

  <!-- Message Modal -->
  <div id="message-modal" class="modal">
    <div id="message-modal-content" class="modal-content">
      <h3 id="modal-title" class="text-lg font-bold mb-2">Notification</h3>
      <p id="modal-message" class="text-gray-600 mb-6"></p>
      <div id="modal-buttons">
        <button
          class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 px-4 rounded-lg transition-colors"
          onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside
      class="w-64 bg-white border-r border-gray-200 flex flex-col fixed h-full z-10 transition-transform duration-300 ease-in-out transform -translate-x-full md:translate-x-0"
      id="sidebar">
      <div class="p-6 border-b border-gray-100">
        <h1 class="text-2xl font-bold text-brand-600 tracking-tight">DASHBOARD</h1>
        <p class="text-sm text-gray-500 mt-1">Vendor Portal</p>
      </div>

      <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
        <a href="/vendor-dashboard"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">🏠</span> Dashboard
        </a>
        <a href="/vendor/products"
          class="flex items-center px-4 py-3 text-brand-700 bg-brand-50 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">📦</span> My Products
        </a>
        <a href="/vendor/inventory"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">📥</span> Inventory
        </a>
        <a href="/vendor/orders"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">🛒</span> Orders
        </a>
        <a href="/vendor/profile"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">👤</span> Profile
        </a>
        <a href="/vendor/notifications"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">🔔</span> Notifications
        </a>
        <a href="/vendor/chat"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">💬</span> Chat
        </a>
      </nav>

      <div class="p-4 border-t border-gray-100">
        <button id="logout-btn"
          class="w-full flex items-center justify-center px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 hover:text-red-700 rounded-lg font-medium transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Log Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 md:ml-64 p-8 transition-all duration-300">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
        <div>
          <h2 class="text-2xl font-bold text-gray-800">My Products</h2>
          <p class="text-gray-500">Manage your product catalog and inventory.</p>
        </div>
        <a href="/vendor/add-product"
          class="inline-flex items-center px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg transition-colors shadow-sm shadow-green-200">
          <span class="mr-2 text-lg">+</span> Add Product
        </a>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-8 flex flex-wrap gap-4 items-center">
        <div class="relative flex-1 min-w-[200px]">
          <input type="text" placeholder="Search products..."
            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent" />
          <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
        </div>
        <select
          class="border-gray-300 border px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 bg-gray-50">
          <option>All Categories</option>
          <option>Grains</option>
          <option>Spices</option>
          <option>Oil</option>
          <option>Vegetables</option>
          <option>Fruits</option>
        </select>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr
                class="bg-gray-50 border-b border-gray-100 text-xs uppercase text-gray-500 font-semibold tracking-wider">
                <th class="px-6 py-4">Product</th>
                <th class="px-6 py-4">Category</th>
                <th class="px-6 py-4">Price</th>
                <th class="px-6 py-4">Stock</th>
                <th class="px-6 py-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="productsTableBody" class="divide-y divide-gray-100">
              <!-- Products will be loaded here by JavaScript -->
              <tr>
                <td colspan="5" class="px-6 py-12 text-center text-gray-500">
                  <div class="flex justify-center mb-2">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-600"></div>
                  </div>
                  Loading products...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Message Modal Functions
    const modal = document.getElementById('message-modal');
    const modalMessage = document.getElementById('modal-message');
    const modalTitle = document.getElementById('modal-title');
    const modalContent = document.getElementById('message-modal-content');
    const modalButtons = document.getElementById('modal-buttons');

    function showModal(message, type, onConfirm) {
      modalMessage.textContent = message;

      if (type === 'success') {
        modalTitle.textContent = 'Success';
        modalTitle.className = 'text-lg font-bold mb-2 text-green-600';
        modalContent.className = 'modal-content success';
      } else if (type === 'error') {
        modalTitle.textContent = 'Error';
        modalTitle.className = 'text-lg font-bold mb-2 text-red-600';
        modalContent.className = 'modal-content error';
      } else {
        modalTitle.textContent = 'Confirm';
        modalTitle.className = 'text-lg font-bold mb-2 text-gray-800';
        modalContent.className = 'modal-content';
      }

      modalButtons.innerHTML = ''; // Clear existing buttons

      if (onConfirm) {
        modalButtons.className = 'confirm-buttons';
        modalButtons.innerHTML = `
          <button class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg font-medium transition-colors" onclick="handleConfirm(true)">Yes, Delete</button>
          <button class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-6 py-2 rounded-lg font-medium transition-colors" onclick="handleConfirm(false)">Cancel</button>
        `;
        window.confirmAction = onConfirm; // Store the callback
      } else {
        modalButtons.className = '';
        modalButtons.innerHTML = `<button class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 px-4 rounded-lg transition-colors" onclick="closeModal()">Close</button>`;
      }

      modal.style.display = 'flex';
      setTimeout(() => {
        modal.classList.add('show');
      }, 10);
    }

    function closeModal() {
      modal.classList.remove('show');
      setTimeout(() => {
        modal.style.display = 'none';
      }, 200);
    }

    function handleConfirm(isConfirmed) {
      closeModal();
      if (window.confirmAction) {
        window.confirmAction(isConfirmed);
        window.confirmAction = null; // Clear the callback
      }
    }

    // Function to fetch and display products
    async function fetchAndDisplayProducts() {
      const productsTableBody = document.getElementById('productsTableBody');
      const token = localStorage.getItem('token');

      if (!token) {
        window.location.href = '/login';
        return;
      }

      try {
        const response = await fetch('/api/vendor/products', {
          method: 'GET',
          headers: {
            'x-auth-token': token
          }
        });
        const result = await response.json();

        if (response.ok && result.success) {
          productsTableBody.innerHTML = ''; // Clear loading message

          if (result.data.length === 0) {
            productsTableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-gray-500"><div class="text-4xl mb-2">📦</div><p>No products found.</p><a href="/vendor/add-product" class="text-brand-600 hover:underline mt-2 inline-block">Add your first product</a></td></tr>`;
            return;
          }

          result.data.forEach(product => {
            const row = document.createElement('tr');
            row.className = 'hover:bg-gray-50 transition-colors group';

            const stockClass = product.stock > 20 ? 'bg-green-100 text-green-700' :
              (product.stock > 0 ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700');

            const stockText = product.stock > 0 ? `${product.stock} units` : 'Out of Stock';

            row.innerHTML = `
              <td class="px-6 py-4">
                <div class="font-semibold text-gray-900">${product.name}</div>
                <div class="text-sm text-gray-500 line-clamp-1 max-w-xs">${product.description}</div>
              </td>
              <td class="px-6 py-4">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800">
                  ${product.category || 'General'}
                </span>
              </td>
              <td class="px-6 py-4 text-sm font-medium text-gray-900">
                ₹${product.price}
                <span class="text-gray-400 font-normal">/${product.unit}</span>
              </td>
              <td class="px-6 py-4">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${stockClass}">
                  ${stockText}
                </span>
              </td>
              <td class="px-6 py-4 text-right text-sm font-medium">
                <button onclick="editProduct('${product._id}')" class="text-brand-600 hover:text-brand-900 mr-3 p-2 hover:bg-brand-50 rounded-lg transition-colors" title="Edit">✏️</button>
                <button onclick="deleteProduct('${product._id}')" class="text-red-600 hover:text-red-900 p-2 hover:bg-red-50 rounded-lg transition-colors" title="Delete">🗑️</button>
              </td>
            `;
            productsTableBody.appendChild(row);
          });
        } else {
          console.error('Error:', result.message);
          productsTableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-red-500">Error loading products: ${result.message || 'Unknown error'}</td></tr>`;
        }
      } catch (error) {
        productsTableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-red-500">Network error. Could not load products.</td></tr>`;
        console.error('Network error fetching products:', error);
      }
    }

    // Call the function to load products when the page loads
    document.addEventListener('DOMContentLoaded', () => {
      fetchAndDisplayProducts();

      // Logout functionality
      document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = '/login';
      });
    });

    function editProduct(productId) {
      localStorage.setItem('editProductId', productId);
      window.location.href = '/vendor/add-product';
    }

    async function deleteProduct(productId) {
      showModal('Are you sure you want to delete this product? This action cannot be undone.', 'confirm', async (confirmed) => {
        if (confirmed) {
          const token = localStorage.getItem('token');
          if (!token) {
            window.location.href = '/login';
            return;
          }

          try {
            const response = await fetch(`/api/vendor/products/${productId}`, {
              method: 'DELETE',
              headers: {
                'x-auth-token': token
              }
            });
            const result = await response.json();

            if (response.ok && result.success) {
              showModal('Product deleted successfully!', 'success');
              setTimeout(() => fetchAndDisplayProducts(), 1000);
            } else {
              showModal('Failed to delete product: ' + (result.message || 'Unknown error'), 'error');
            }
          } catch (error) {
            console.error('Error deleting product:', error);
            showModal('An error occurred while deleting the product.', 'error');
          }
        }
      });
    }
  </script>
</body>

</html>
