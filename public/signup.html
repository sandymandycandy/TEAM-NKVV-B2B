<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScubeG - Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Michroma&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Michroma', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-image: url('https://uploads.onecompiler.io/43rrvywxn/43rrvxhs2/Screenshot_25-7-2025_134332_www.designevo.com.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .glass-panel {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Custom scrollbar for the form if it gets too long on small screens */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>

<body class="h-screen w-full flex items-center justify-center overflow-hidden">

  <div
    class="glass-panel w-full max-w-md p-8 rounded-2xl shadow-2xl mx-4 transform transition-all hover:scale-[1.01] duration-300 max-h-[90vh] flex flex-col">
    <div class="flex justify-center mb-4 shrink-0">
      <img src="https://uploads.onecompiler.io/43rrvywxn/43rrvxhs2/Screenshot_25-7-2025_135128_www.designevo.com.jpeg"
        alt="ScubeG Logo" class="w-16 h-16 rounded-full shadow-lg border-2 border-brand-500/30">
    </div>

    <h2 class="text-center text-2xl font-bold text-white mb-2 font-display shrink-0">Create <span
        class="text-brand-400">ScubeG</span> Account</h2>

    <div class="overflow-y-auto custom-scrollbar pr-2 -mr-2 flex-1">
      <form id="signupform" class="space-y-4 mt-2">
        <div>
          <label for="fullname" class="block text-sm font-medium text-gray-300 mb-1">Full Name</label>
          <input type="text" id="fullname" placeholder="John Doe" required
            class="w-full px-4 py-2.5 rounded-lg bg-gray-800/50 border border-gray-600 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200">
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required
            class="w-full px-4 py-2.5 rounded-lg bg-gray-800/50 border border-gray-600 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
            <input type="password" id="password" placeholder="••••••••" required
              class="w-full px-4 py-2.5 rounded-lg bg-gray-800/50 border border-gray-600 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200">
          </div>
          <div>
            <label for="confirm-password" class="block text-sm font-medium text-gray-300 mb-1">Confirm</label>
            <input type="password" id="confirm-password" placeholder="••••••••" required
              class="w-full px-4 py-2.5 rounded-lg bg-gray-800/50 border border-gray-600 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200">
          </div>
        </div>

        <div>
          <label for="role" class="block text-sm font-medium text-gray-300 mb-1">Select Role</label>
          <div class="relative">
            <select id="role" required
              class="w-full px-4 py-2.5 rounded-lg bg-gray-800/50 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200 appearance-none">
              <option value="" disabled selected>Select your role</option>
              <option value="vendor">Vendor</option>
              <option value="buyer">Buyer</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
              <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" />
              </svg>
            </div>
          </div>
        </div>

        <button type="submit"
          class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-brand-500/30 hover:shadow-brand-500/50 transform hover:-translate-y-0.5 transition-all duration-200 mt-2">
          Create Account
        </button>
      </form>

      <!-- Message box -->
      <div id="message-box" class="mt-4 p-3 rounded-lg text-center text-sm hidden transition-all duration-300"></div>

      <div class="mt-6 text-center text-sm text-gray-400 pb-2">
        Already have an account? <a href="/login"
          class="text-brand-400 hover:text-brand-300 font-medium transition-colors">Sign In</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('signupform').addEventListener('submit', async function (e) {
      e.preventDefault();

      const name = document.getElementById('fullname').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const role = document.getElementById('role').value;
      const messageBox = document.getElementById('message-box');
      const submitBtn = document.querySelector('button[type="submit"]');

      // Function to show a message in the message box
      function showMessage(message, type) {
        messageBox.textContent = message;
        messageBox.classList.remove('hidden', 'bg-red-500/20', 'text-red-200', 'bg-green-500/20', 'text-green-200');

        if (type === 'error') {
          messageBox.classList.add('bg-red-500/20', 'text-red-200', 'border', 'border-red-500/30');
        } else {
          messageBox.classList.add('bg-green-500/20', 'text-green-200', 'border', 'border-green-500/30');
        }
        messageBox.classList.remove('hidden');
      }

      // Hide message box on new submission
      messageBox.classList.add('hidden');

      if (password !== confirmPassword) {
        showMessage("Passwords do not match.", "error");
        return;
      }

      // Loading state
      const originalBtnText = submitBtn.textContent;
      submitBtn.textContent = 'Creating Account...';
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });

        const data = await res.json();

        if (data.success) {
          // Display success message and then redirect
          showMessage(data.message, "success");
          setTimeout(() => {
            window.location.href = '/login';
          }, 2000); // Redirect after 2 seconds
        } else {
          showMessage(data.message || 'Signup error: Unknown error', "error");
          submitBtn.textContent = originalBtnText;
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        }
      } catch (err) {
        console.error('Signup JS error:', err);
        showMessage('Something went wrong. Please try again.', "error");
        submitBtn.textContent = originalBtnText;
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
      }
    });
  </script>
</body>

</html>
