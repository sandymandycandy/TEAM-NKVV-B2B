<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order History - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <style>
    .modal {
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #fefefe;
      padding: 24px;
      border-radius: 16px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      transform: scale(0.95);
      transition: transform 0.2s;
    }

    .modal.show .modal-content {
      transform: scale(1);
    }

    .modal-content.success {
      border-left: 4px solid #10b981;
    }

    .modal-content.error {
      border-left: 4px solid #ef4444;
    }
  </style>
</head>

<body class="bg-gray-50 font-sans text-gray-900">

  <!-- Message Modal -->
  <div id="message-modal" class="modal">
    <div id="message-modal-content" class="modal-content">
      <h3 id="modal-title" class="text-lg font-bold mb-2">Notification</h3>
      <p id="modal-message" class="text-gray-600 mb-6"></p>
      <button
        class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 px-4 rounded-lg transition-colors"
        onclick="closeModal()">Close</button>
    </div>
  </div>

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside
      class="w-64 bg-white border-r border-gray-200 flex flex-col fixed h-full z-20 transition-transform duration-300 ease-in-out transform -translate-x-full md:translate-x-0"
      id="sidebar">
      <div class="p-6 border-b border-gray-100 flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-bold text-brand-600 tracking-tight">DASHBOARD</h1>
          <p class="text-sm text-gray-500 mt-1">Buyer Portal</p>
        </div>
        <button id="close-sidebar" class="md:hidden text-gray-500 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
        <a href="/buyer-dashboard"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">🏠</span> Home
        </a>
        <a href="/buyer/products"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">📦</span> Products Listing
        </a>
        <a href="/buyer/cart"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">🛒</span> My Cart
        </a>
        <a href="/buyer/profile"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">👤</span> Profile
        </a>
        <a href="/buyer/history"
          class="flex items-center px-4 py-3 text-brand-700 bg-brand-50 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">📥</span> History
        </a>
        <a href="/buyer/chat"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">💬</span> Chat
        </a>
      </nav>

      <div class="p-4 border-t border-gray-100">
        <button id="logout-btn"
          class="w-full flex items-center justify-center px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 hover:text-red-700 rounded-lg font-medium transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Log Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 md:ml-64 p-8 transition-all duration-300">
      <!-- Header -->
      <header class="flex justify-between items-center mb-8">
        <div class="flex items-center gap-4">
          <button id="sidebar-toggle" class="md:hidden text-gray-600 hover:text-gray-900 focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
          <h2 class="text-2xl font-bold text-gray-800">Order History</h2>
        </div>
        <div class="flex items-center gap-4">
          <div class="bg-white p-2 rounded-full shadow-sm border border-gray-100">
            <span class="text-xl">👤</span>
          </div>
        </div>
      </header>

      <div class="max-w-5xl mx-auto">
        <!-- Search & Filters -->
        <div
          class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-8 flex flex-wrap gap-4 items-center justify-between">
          <!-- Left: Search Input -->
          <div class="relative flex-1 min-w-[200px] max-w-sm">
            <input type="text" id="searchOrderInput" placeholder="Search Order ID..."
              class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent" />
            <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
          </div>

          <!-- Right: Date Range + Search Button -->
          <div class="flex items-center gap-3 flex-wrap">
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-600 font-medium">From:</label>
              <input type="date" id="fromDate"
                class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
            </div>
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-600 font-medium">To:</label>
              <input type="date" id="toDate"
                class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
            </div>
            <button id="filterBtn"
              class="bg-brand-600 text-white px-5 py-2 text-sm font-medium rounded-lg hover:bg-brand-700 transition-colors shadow-sm">
              Filter
            </button>
            <button id="clearBtn"
              class="bg-white border border-gray-300 text-gray-700 px-5 py-2 text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors shadow-sm">
              Clear
            </button>
          </div>
        </div>

        <!-- Order Cards -->
        <div id="order-history-container" class="space-y-4">
          <div class="p-12 text-center text-gray-500">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-brand-600 mx-auto mb-4"></div>
            <p>Loading order history...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Message Modal Functions
    const modal = document.getElementById('message-modal');
    const modalMessage = document.getElementById('modal-message');
    const modalTitle = document.getElementById('modal-title');
    const modalContent = document.getElementById('message-modal-content');

    function showModal(message, type) {
      modalMessage.textContent = message;
      if (type === 'success') {
        modalTitle.textContent = 'Success';
        modalTitle.className = 'text-lg font-bold mb-2 text-green-600';
        modalContent.className = 'modal-content success';
      } else {
        modalTitle.textContent = 'Error';
        modalTitle.className = 'text-lg font-bold mb-2 text-red-600';
        modalContent.className = 'modal-content error';
      }
      modal.style.display = 'flex';
      setTimeout(() => {
        modal.classList.add('show');
      }, 10);
    }

    function closeModal() {
      modal.classList.remove('show');
      setTimeout(() => {
        modal.style.display = 'none';
      }, 200);
    }

    // Sidebar Toggle Logic
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const closeSidebar = document.getElementById('close-sidebar');

    if (sidebarToggle) {
      sidebarToggle.addEventListener('click', () => {
        sidebar.classList.remove('-translate-x-full');
      });
    }

    if (closeSidebar) {
      closeSidebar.addEventListener('click', () => {
        sidebar.classList.add('-translate-x-full');
      });
    }

    let allOrders = [];

    async function loadOrderHistory() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login';
        return;
      }

      try {
        const res = await fetch('/api/buyer/history', {
          headers: { 'x-auth-token': token }
        });
        const data = await res.json();
        const container = document.getElementById('order-history-container');
        container.innerHTML = '';

        if (data.success && data.data.length > 0) {
          allOrders = data.data;
          renderOrders(allOrders);
        } else {
          container.innerHTML = `
                        <div class="text-center py-12 bg-white rounded-xl border border-gray-100">
                            <div class="text-4xl mb-3">📦</div>
                            <p class="text-gray-500">No order history found.</p>
                            <a href="/buyer/products" class="inline-block mt-4 text-brand-600 font-medium hover:underline">Start Shopping</a>
                        </div>`;
        }
      } catch (err) {
        console.error('Error loading order history:', err);
        showModal('Failed to load order history.', 'error');
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById('order-history-container');
      container.innerHTML = '';

      if (orders.length === 0) {
        container.innerHTML = `
                    <div class="text-center py-8">
                        <p class="text-gray-500">No orders match your search.</p>
                    </div>`;
        return;
      }

      orders.forEach(order => {
        const orderCard = document.createElement('div');
        orderCard.className = 'bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow';

        let statusClass = 'bg-gray-100 text-gray-800';
        if (order.statusText === 'Delivered') statusClass = 'bg-green-100 text-green-800';
        else if (order.statusText === 'Cancelled') statusClass = 'bg-red-100 text-red-800';
        else if (order.statusText === 'Pending') statusClass = 'bg-yellow-100 text-yellow-800';

        orderCard.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <div class="flex items-center gap-3 mb-1">
                                <h3 class="text-lg font-bold text-gray-800">Order #${order.orderId}</h3>
                                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${statusClass}">${order.statusText}</span>
                            </div>
                            <p class="text-sm text-gray-500">Placed on ${order.date}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-2xl font-bold text-brand-600">₹${order.total.toFixed(2)}</p>
                            <p class="text-xs text-gray-400">Total Amount</p>
                        </div>
                    </div>
                    
                    <div class="mt-4 pt-4 border-t border-gray-50 flex flex-wrap justify-between items-center gap-4">
                        <div class="flex items-center gap-2 text-sm text-gray-600">
                            <span class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-lg">🛍️</span>
                            <span>Vendor: <span class="font-medium text-gray-900">${order.vendorName}</span></span>
                        </div>
                        <a href="/buyer/order-details?id=${order.orderId}" 
                           class="inline-flex items-center px-4 py-2 bg-brand-50 text-brand-700 rounded-lg text-sm font-medium hover:bg-brand-100 transition-colors">
                            View Details
                            <svg class="w-4 h-4 ml-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                            </svg>
                        </a>
                    </div>
                `;
        container.appendChild(orderCard);
      });
    }

    // Filter Logic
    document.getElementById('filterBtn').addEventListener('click', () => {
      const searchTerm = document.getElementById('searchOrderInput').value.toLowerCase();
      const fromDate = document.getElementById('fromDate').value;
      const toDate = document.getElementById('toDate').value;

      const filtered = allOrders.filter(order => {
        const matchesSearch = order.orderId.toLowerCase().includes(searchTerm) ||
          order.vendorName.toLowerCase().includes(searchTerm);

        // Simple date comparison (assuming order.date is parseable or we'd need to parse it properly)
        // For now, let's just stick to search ID as date formats can be tricky without moment.js/date-fns

        return matchesSearch;
      });

      renderOrders(filtered);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('searchOrderInput').value = '';
      document.getElementById('fromDate').value = '';
      document.getElementById('toDate').value = '';
      renderOrders(allOrders);
    });

    document.addEventListener('DOMContentLoaded', async () => {
      await loadOrderHistory();

      document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = '/login';
      });
    });
  </script>
</body>

</html>
