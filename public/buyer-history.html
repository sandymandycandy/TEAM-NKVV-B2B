<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Buyer Order History - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
  <style>
    /* Styles for the modal */
    .modal {
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: #fefefe;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      text-align: center;
    }
    .modal-content.success {
      background-color: #d1e7dd;
      color: #0f5132;
    }
    .modal-content.error {
      background-color: #f8d7da;
      color: #842029;
    }
  </style>
</head>
<body class="bg-gray-100 font-[Inter]">

  <!-- Message Modal -->
  <div id="message-modal" class="modal">
    <div id="message-modal-content" class="modal-content">
      <p id="modal-message"></p>
      <button class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-md" onclick="closeModal()">Close</button>
    </div>
  </div>

  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r p-6">
      <h2 class="text-2xl font-bold text-teal-600">Dashboard</h2>
      <p class="text-sm text-gray-500 mb-8">Buyer</p>
      <nav class="space-y-4">
        <a href="/buyer-dashboard" class="flex items-center gap-2 text-gray-700 hover:text-blue-600">🏠 Home</a>
        <a href="/buyer/products" class="flex items-center gap-2 text-gray-700 hover:text-blue-600">📦 Products</a>
        <a href="/buyer/cart" class="flex items-center gap-2 text-gray-700 hover:text-blue-600">🛒 My Cart</a>
        <a href="/buyer/profile" class="flex items-center gap-2 text-gray-700 hover:text-blue-600">👤 Profile</a>
        <a href="/buyer/history" class="flex items-center gap-2 text-white bg-blue-600 px-3 py-2 rounded-md font-semibold">📥 History</a>
        <a href="/buyer/chat" class="flex items-center gap-2 text-gray-700 hover:text-blue-600">💬 Chat</a>
      </nav>
    </aside>

    <!-- History Section -->
    <section class="flex-1 p-10">
      <div class="max-w-5xl mx-auto text-sm">
        <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">📥 Order History</h2>

        <!-- Search & Filters -->
        <div class="flex flex-wrap justify-between items-center mb-6 gap-2">
          <!-- Left: Search Input -->
          <input type="text" placeholder="Search Order ID" class="flex-1 min-w-[200px] max-w-sm border border-gray-300 rounded-md px-3 py-1.5 text-sm" />

          <!-- Right: Date Range + Search Button -->
          <div class="flex items-center gap-2 flex-wrap justify-end">
            <label class="text-sm text-gray-600">From:</label>
            <input type="date" class="border border-gray-300 rounded-md px-2 py-1 text-sm" />
            <label class="text-sm text-gray-600">To:</label>
            <input type="date" class="border border-gray-300 rounded-md px-2 py-1 text-sm" />
            <button class="bg-blue-600 text-white px-4 py-1.5 text-sm rounded-md hover:bg-blue-700">Search</button>
          </div>
        </div>

        <!-- Order Cards -->
        <div id="order-history-container" class="space-y-4 max-h-[70vh] overflow-y-auto pr-2">
          <!-- Order will be injected here -->
        </div>
      </div>
    </section>
  </div>

<script>
  // Message Modal Functions
  const modal = document.getElementById('message-modal');
  const modalMessage = document.getElementById('modal-message');
  const modalContent = document.getElementById('message-modal-content');

  function showModal(message, type) {
      modalMessage.textContent = message;
      modalContent.className = 'modal-content ' + type;
      modal.style.display = 'flex';
  }

  function closeModal() {
      modal.style.display = 'none';
  }

  async function loadOrderHistory() {
    const token = localStorage.getItem('token');
    if (!token) {
        showModal('Please log in first.', 'error');
        setTimeout(() => window.location.href = '/login', 2000);
        return;
    }

    try {
        const res = await fetch('/api/buyer/history', {
            headers: { 'x-auth-token': token }
        });
        const data = await res.json();
        const container = document.getElementById('order-history-container');
        container.innerHTML = '';

        if (data.success && data.data.length > 0) {
            data.data.forEach(order => {
                const orderCard = document.createElement('div');
                orderCard.className = 'bg-white p-4 rounded-lg shadow-sm';
                orderCard.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center">
                        <div>
                            <p class="text-gray-700 font-medium">Order #${order.orderId}</p>
                            <p class="text-gray-500 text-xs">Placed on: ${order.date}</p>
                        </div>
                        <div class="flex items-center gap-3 mt-2 md:mt-0">
                            <span class="text-gray-800 font-semibold">₹${order.total.toFixed(2)}</span>
                            <span class="text-xs bg-${order.statusColor}-100 text-${order.statusColor}-600 px-2 py-1 rounded-full">${order.statusText}</span>
                        </div>
                    </div>
                    <p class="text-center text-gray-600 text-sm font-medium mt-3">🛍️ Vendor: <span class="text-gray-800">${order.vendorName}</span></p>
                `;
                container.appendChild(orderCard);
            });
        } else {
            container.innerHTML = '<p class="text-gray-500">No order history found.</p>';
        }
    } catch (err) {
        console.error('Error loading order history:', err);
        showModal('Failed to load order history.', 'error');
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    await loadOrderHistory();
  });
</script>

</body>
</html>
