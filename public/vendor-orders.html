<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Orders - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Styles for the modal */
    .modal {
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #fefefe;
      padding: 24px;
      border-radius: 16px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      transform: scale(0.95);
      transition: transform 0.2s;
    }

    .modal.show .modal-content {
      transform: scale(1);
    }

    .modal-content.error {
      border-left: 4px solid #ef4444;
    }

    .modal-content.success {
      border-left: 4px solid #10b981;
    }
  </style>
</head>

<body class="bg-gray-50 font-sans text-gray-900">

  <!-- Message Modal -->
  <div id="message-modal" class="modal">
    <div id="message-modal-content" class="modal-content">
      <h3 id="modal-title" class="text-lg font-bold mb-2">Notification</h3>
      <p id="modal-message" class="text-gray-600 mb-6"></p>
      <button
        class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 px-4 rounded-lg transition-colors"
        onclick="closeModal()">Close</button>
    </div>
  </div>

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside
      class="w-64 bg-white border-r border-gray-200 flex flex-col fixed h-full z-10 transition-transform duration-300 ease-in-out transform -translate-x-full md:translate-x-0"
      id="sidebar">
      <div class="p-6 border-b border-gray-100">
        <h1 class="text-2xl font-bold text-brand-600 tracking-tight">DASHBOARD</h1>
        <p class="text-sm text-gray-500 mt-1">Vendor Portal</p>
      </div>

      <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
        <a href="/vendor-dashboard"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">🏠</span> Home
        </a>
        <a href="/vendor/products"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">📦</span> My Products
        </a>
        <a href="/vendor/inventory"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">📥</span> Inventory
        </a>
        <a href="/vendor/orders"
          class="flex items-center px-4 py-3 text-brand-700 bg-brand-50 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">🛒</span> Orders
        </a>
        <a href="/vendor/profile"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">👤</span> Profile
        </a>
        <a href="/vendor/notifications"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">🔔</span> Notifications
        </a>
        <a href="/vendor/chat"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">💬</span> Chat
        </a>
      </nav>

      <div class="p-4 border-t border-gray-100">
        <button id="logout-btn"
          class="w-full flex items-center justify-center px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 hover:text-red-700 rounded-lg font-medium transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Log Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 md:ml-64 p-8 transition-all duration-300">
      <div class="max-w-6xl mx-auto">
        <h2 class="text-2xl font-bold text-gray-800 mb-8 flex items-center gap-2">
          <span>📝</span> Order History
        </h2>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Order ID
                  </th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Customer
                  </th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Amount</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Actions
                  </th>
                </tr>
              </thead>
              <tbody id="orders-table-body" class="bg-white divide-y divide-gray-200">
                <!-- Orders will be injected here -->
                <tr>
                  <td colspan="6" class="text-center p-12 text-gray-500">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-brand-600 mx-auto mb-4"></div>
                    <p>Loading orders...</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Message Modal Functions
    const modal = document.getElementById('message-modal');
    const modalMessage = document.getElementById('modal-message');
    const modalTitle = document.getElementById('modal-title');
    const modalContent = document.getElementById('message-modal-content');

    function showModal(message, type) {
      modalMessage.textContent = message;
      if (type === 'success') {
        modalTitle.textContent = 'Success';
        modalTitle.className = 'text-lg font-bold mb-2 text-green-600';
        modalContent.className = 'modal-content success';
      } else {
        modalTitle.textContent = 'Error';
        modalTitle.className = 'text-lg font-bold mb-2 text-red-600';
        modalContent.className = 'modal-content error';
      }
      modal.style.display = 'flex';
      setTimeout(() => {
        modal.classList.add('show');
      }, 10);
    }

    function closeModal() {
      modal.classList.remove('show');
      setTimeout(() => {
        modal.style.display = 'none';
      }, 200);
    }

    async function loadOrders() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login';
        return;
      }

      const tableBody = document.getElementById('orders-table-body');

      try {
        const response = await fetch('/api/vendor/orders', {
          headers: {
            'x-auth-token': token
          }
        });

        if (response.ok) {
          const result = await response.json();
          if (result.success) {
            tableBody.innerHTML = '';
            if (result.orders.length === 0) {
              tableBody.innerHTML = `
                <tr>
                  <td colspan="6" class="text-center p-8 text-gray-500">No orders found.</td>
                </tr>`;
              return;
            }

            result.orders.forEach(order => {
              const tr = document.createElement('tr');
              tr.className = 'hover:bg-gray-50 transition-colors';

              let statusClass = 'bg-gray-100 text-gray-800';
              if (order.status === 'Delivered') statusClass = 'bg-green-100 text-green-800';
              else if (order.status === 'Cancelled') statusClass = 'bg-red-100 text-red-800';
              else if (order.status === 'Pending') statusClass = 'bg-yellow-100 text-yellow-800';

              tr.innerHTML = `
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${order.orderIdDisplay || order._id.substring(0, 8)}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${order.buyerId ? order.buyerId.name : 'Unknown'}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(order.orderDate).toLocaleDateString()}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-medium">₹${order.totalAmount.toFixed(2)}</td>
                <td class="px-6 py-4 whitespace-nowrap">
                  <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusClass}">
                    ${order.status}
                  </span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                  <a href="/vendor/order-details?id=${order.orderIdDisplay || order._id}" class="text-brand-600 hover:text-brand-900 mr-3 font-medium transition-colors">View Details</a>
                  ${order.status === 'Pending' ? `
                  <button onclick="markAsDelivered('${order._id}')"
                    class="text-green-600 hover:text-green-900 mr-3 font-medium transition-colors">Mark
                    Delivered</button>
                  <button onclick="markAsCancelled('${order._id}')"
                    class="text-red-600 hover:text-red-900 font-medium transition-colors">Cancel</button>
                  ` : '<span class="text-gray-400">No actions</span>'}
                </td>
                `;
              tableBody.appendChild(tr);
            });
          } else {
            tableBody.innerHTML = `<tr>
                  <td colspan="6" class="text-center p-8 text-red-500">Failed to load orders.</td>
                </tr>`;
          }
        } else {
          tableBody.innerHTML = `<tr>
                  <td colspan="6" class="text-center p-8 text-red-500">Failed to fetch orders.</td>
                </tr>`;
        }
      } catch (err) {
        console.error('Error loading orders:', err);
        tableBody.innerHTML = `<tr>
                  <td colspan="6" class="text-center p-8 text-red-500">Error loading orders.</td>
                </tr>`;
      }
    }

    async function markAsDelivered(orderId) {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login';
        return;
      }

      try {
        const response = await fetch(`/api/vendor/orders/${orderId}/delivered`, {
          method: 'PUT',
          headers: {
            'x-auth-token': token
          }
        });

        const result = await response.json();
        if (response.ok && result.success) {
          showModal('Order marked as delivered.', 'success');
          loadOrders();
        } else {
          showModal(result.message || 'Failed to update order.', 'error');
        }
      } catch (err) {
        console.error('Error updating order:', err);
        showModal('Error updating order status.', 'error');
      }
    }

    async function markAsCancelled(orderId) {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login';
        return;
      }

      try {
        const response = await fetch(`/api/vendor/orders/${orderId}/cancelled`, {
          method: 'PUT',
          headers: {
            'x-auth-token': token
          }
        });

        const result = await response.json();
        if (response.ok && result.success) {
          showModal('Order cancelled.', 'success');
          loadOrders();
        } else {
          showModal(result.message || 'Failed to cancel order.', 'error');
        }
      } catch (err) {
        console.error('Error cancelling order:', err);
        showModal('Error cancelling order.', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadOrders();

      document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = '/login';
      });
    });
  </script>
</body>

</html>
