<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Product</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Styles for the modal */
    .modal {
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: #fefefe;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      text-align: center;
    }
    .modal-content.success {
      background-color: #d1e7dd;
      color: #0f5132;
    }
    .modal-content.error {
      background-color: #f8d7da;
      color: #842029;
    }
  </style>
</head>
<body class="bg-gray-50 flex">

  <!-- Message Modal -->
  <div id="message-modal" class="modal">
    <div id="message-modal-content" class="modal-content">
      <p id="modal-message"></p>
      <button class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-md" onclick="closeModal()">Close</button>
    </div>
  </div>

  <!-- Sidebar -->
  <aside>
    <h2>DASHBOARD</h2>
    <p>Vendor</p>
    <nav>
      <a href="/vendor-dashboard"><span>🏠</span> Dashboard</a>
      <a href="/vendor/products"><span>📦</span> My Products</a>
      <a href="/vendor/inventory"><span>📥</span> Inventory</a>
      <a href="/vendor/orders"><span>🛒</span> Orders</a>
      <a href="/vendor/profile"><span>👤</span> Profile</a>
      <a href="/vendor/notifications"><span>🔔</span> Notifications</a>
      <a href="/vendor/chat"><span>💬</span> Chat</a>
    </nav>
    <button class="logout-btn" id="logout-btn" style="margin-top: auto;">Log Out</button>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-10 overflow-y-auto">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-md">
      <h2 id="formTitle" class="text-2xl font-bold mb-6">Add New Product</h2>

      <form id="addProductForm" enctype="multipart/form-data" class="space-y-6">
        <div>
          <label class="block mb-1 font-medium">Product Name</label>
          <input id="productName" type="text" name="name" class="w-full border border-gray-300 px-4 py-2 rounded" placeholder="e.g. Organic Turmeric" required />
        </div>

        <div>
          <label class="block mb-1 font-medium">Description</label>
          <textarea id="productDescription" name="description" rows="3" class="w-full border border-gray-300 px-4 py-2 rounded" placeholder="Product details..." required></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block mb-1 font-medium">Category</label>
            <select id="productCategory" name="category" class="w-full border border-gray-300 px-4 py-2 rounded" required>
              <option value="">Select Category</option>
              <option value="Grains">Grains</option>
              <option value="Spices">Spices</option>
              <option value="Oil">Oil</option>
              <option value="Vegetables">Vegetables</option>
              <option value="Fruits">Fruits</option>
              <option value="Dairy">Dairy</option>
            </select>
          </div>
          <div>
            <label class="block mb-1 font-medium">Price (₹)</label>
            <input id="productPrice" type="number" name="price" class="w-full border border-gray-300 px-4 py-2 rounded" placeholder="e.g. 280" required />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block mb-1 font-medium">Unit</label>
            <input id="productUnit" type="text" name="unit" class="w-full border border-gray-300 px-4 py-2 rounded" placeholder="e.g. per kg, per piece, per liter" required />
          </div>
          <div>
            <label class="block mb-1 font-medium">Stock</label>
            <input id="productStock" type="number" name="stock" class="w-full border border-gray-300 px-4 py-2 rounded" placeholder="e.g. 50" required />
          </div>
        </div>

        <div>
          <label class="block mb-1 font-medium">Upload Image</label>
          <input type="file" name="image" accept="image/*" class="w-full border border-gray-300 px-4 py-2 rounded" />
        </div>

        <div class="text-right">
          <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">
            Save Product
          </button>
        </div>
      </form>
    </div>
  </main>

<script>
  // Message Modal Functions
  const modal = document.getElementById('message-modal');
  const modalMessage = document.getElementById('modal-message');
  const modalContent = document.getElementById('message-modal-content');

  function showModal(message, type) {
      modalMessage.textContent = message;
      modalContent.className = 'modal-content ' + type;
      modal.style.display = 'flex';
  }

  function closeModal() {
      modal.style.display = 'none';
  }

  document.getElementById('addProductForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const token = localStorage.getItem("token");
    const editId = localStorage.getItem('editProductId');

    if (!token) {
      showModal("🚫 You must be logged in.", "error");
      setTimeout(() => window.location.href = '/login', 2000);
      return;
    }

    const formData = new FormData(this); // Collect all form fields including file

    const url = editId ? `/api/vendor/products/${editId}` : '/api/vendor/products';
    const method = editId ? 'PUT' : 'POST';

    try {
      const response = await fetch(url, {
        method,
        headers: {
          // IMPORTANT: Do NOT set 'Content-Type' when sending FormData.
          // The browser sets the correct 'multipart/form-data' header automatically.
          'x-auth-token': token
        },
        body: formData
      });

      const result = await response.json();

      if (response.ok) {
        showModal(editId ? '✅ Product updated successfully!' : '✅ Product added successfully!', "success");
        localStorage.removeItem('editProductId'); // Clear edit ID after successful operation
        setTimeout(() => {
          window.location.href = '/vendor/products'; // Redirect to product list
        }, 1500);
      } else {
        showModal('❌ Failed: ' + (result.message || result.error || 'Unknown error'), "error");
      }
    } catch (error) {
      console.error('Error:', error);
      showModal('⚠ An unexpected error occurred.', "error");
    }
  });

  document.addEventListener('DOMContentLoaded', async () => {
    const token = localStorage.getItem('token');
    const editId = localStorage.getItem('editProductId');

    if (!token) {
        showModal("Please log in first.", "error");
        setTimeout(() => window.location.href = '/login', 2000);
        return;
    }

    if (editId) {
      document.getElementById('formTitle').innerText = "Edit Product";

      try {
        const response = await fetch(`/api/vendor/products/${editId}`, {
          method: 'GET',
          headers: { 'x-auth-token': token }
        });
        const result = await response.json();

        if (response.ok && result.success) {
          const product = result.data;
          document.getElementById('productName').value = product.name || '';
          document.getElementById('productDescription').value = product.description || '';
          document.getElementById('productCategory').value = product.category || '';
          document.getElementById('productPrice').value = product.price || '';
          document.getElementById('productUnit').value = product.unit || '';
          document.getElementById('productStock').value = product.stock || '';
          // If you have an image preview, you'd load it here:
          // if (product.image) { document.getElementById('productImagePreview').src = product.image; }
        } else {
          showModal('Could not load product details: ' + (result.message || 'Unknown error'), "error");
        }
      } catch (err) {
        console.error('Error loading product:', err);
        showModal('Error fetching product details.', "error");
      }
    }
  });
</script>

</body>
</html>
