<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy Products - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Styles for the modal */
    .modal {
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #fefefe;
      padding: 24px;
      border-radius: 16px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      transform: scale(0.95);
      transition: transform 0.2s;
    }

    .modal.show .modal-content {
      transform: scale(1);
    }

    .modal-content.success {
      border-left: 4px solid #10b981;
    }

    .modal-content.error {
      border-left: 4px solid #ef4444;
    }
  </style>
</head>

<body class="bg-gray-50 font-sans text-gray-900">

  <!-- Message Modal -->
  <div id="message-modal" class="modal">
    <div id="message-modal-content" class="modal-content">
      <h3 id="modal-title" class="text-lg font-bold mb-2">Notification</h3>
      <p id="modal-message" class="text-gray-600 mb-6"></p>
      <button
        class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 px-4 rounded-lg transition-colors"
        onclick="closeModal()">Close</button>
    </div>
  </div>

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside
      class="w-64 bg-white border-r border-gray-200 flex flex-col fixed h-full z-10 transition-transform duration-300 ease-in-out transform -translate-x-full md:translate-x-0"
      id="sidebar">
      <div class="p-6 border-b border-gray-100">
        <h1 class="text-2xl font-bold text-brand-600 tracking-tight">DASHBOARD</h1>
        <p class="text-sm text-gray-500 mt-1">Buyer Portal</p>
      </div>

      <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
        <a href="/buyer-dashboard"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">🏠</span> Home
        </a>
        <a href="/buyer/products"
          class="flex items-center px-4 py-3 text-brand-700 bg-brand-50 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">🛍️</span> Products Listing
        </a>
        <a href="/buyer/cart"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">🛒</span> My Cart
        </a>
        <a href="/buyer/profile"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">👤</span> Profile
        </a>
        <a href="/buyer/history"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">📥</span> History
        </a>
        <a href="/buyer/chat"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">💬</span> Chat
        </a>
      </nav>

      <div class="p-4 border-t border-gray-100">
        <button id="logout-btn"
          class="w-full flex items-center justify-center px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 hover:text-red-700 rounded-lg font-medium transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Log Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 md:ml-64 p-8 transition-all duration-300">
      <!-- Header -->
      <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
        <div>
          <h2 class="text-2xl font-bold text-gray-800">Browse Products</h2>
          <p class="text-gray-500">Find the best products from our verified vendors.</p>
        </div>
        <div class="w-full md:w-auto relative">
          <input type="text" id="searchInput" placeholder="Search products..."
            class="w-full md:w-80 pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent" />
          <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
        </div>
      </header>

      <!-- Filters -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-8 flex flex-wrap gap-4 items-center">
        <span class="text-sm font-medium text-gray-500 mr-2">Filters:</span>
        <select id="categoryFilter"
          class="border-gray-300 border px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 bg-gray-50">
          <option value="">All Categories</option>
          <option value="Grains">Grains</option>
          <option value="Oils">Oils</option>
          <option value="Beverages">Beverages</option>
          <option value="Snacks">Snacks</option>
          <option value="Electronics">Electronics</option>
          <option value="Test">Test</option>
        </select>

        <select id="sortFilter"
          class="border-gray-300 border px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 bg-gray-50">
          <option value="featured">Sort by: Featured</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="newest">Newest Arrivals</option>
        </select>
      </div>

      <!-- Product Grid -->
      <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Products will be injected here -->
        <div class="col-span-full flex justify-center py-12">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-600"></div>
        </div>
      </div>

    </main>
  </div>

  <script>
    // Message Modal Functions
    const modal = document.getElementById('message-modal');
    const modalMessage = document.getElementById('modal-message');
    const modalTitle = document.getElementById('modal-title');
    const modalContent = document.getElementById('message-modal-content');

    function showModal(message, type) {
      modalMessage.textContent = message;
      if (type === 'success') {
        modalTitle.textContent = 'Success';
        modalTitle.className = 'text-lg font-bold mb-2 text-green-600';
        modalContent.className = 'modal-content success';
      } else {
        modalTitle.textContent = 'Error';
        modalTitle.className = 'text-lg font-bold mb-2 text-red-600';
        modalContent.className = 'modal-content error';
      }
      modal.style.display = 'flex';
      setTimeout(() => {
        modal.classList.add('show');
      }, 10);
    }

    function closeModal() {
      modal.classList.remove('show');
      setTimeout(() => {
        modal.style.display = 'none';
      }, 200);
    }

    // Global token for API calls
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/login';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('searchInput');
      const categoryFilter = document.getElementById('categoryFilter');
      const sortFilter = document.getElementById('sortFilter');

      // Load products
      async function loadProducts() {
        const productList = document.getElementById('product-list');
        productList.innerHTML = `
          <div class="col-span-full flex justify-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-600"></div>
          </div>
        `;

        const search = searchInput.value;
        const category = categoryFilter.value;
        const sort = sortFilter.value;

        const params = new URLSearchParams();
        if (search) params.append('search', search);
        if (category) params.append('category', category);
        if (sort) params.append('sort', sort);

        try {
          const res = await fetch(`/api/buyer/products?${params.toString()}`, {
            headers: {
              'x-auth-token': token
            }
          });
          const result = await res.json();

          if (res.ok && result.success) {
            productList.innerHTML = '';
            if (result.data.length === 0) {
              productList.innerHTML = `
                <div class="col-span-full text-center py-12 text-gray-500">
                  <p class="text-2xl mb-4">No products found 😔</p>
                  <p>Check back later or adjust your filters.</p>
                </div>
              `;
              return;
            }

            result.data.forEach(product => {
              const productCard = document.createElement('div');
              productCard.className = 'bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col hover:shadow-md transition-shadow';
              productCard.innerHTML = `
                <img src="${product.image || 'https://via.placeholder.com/400x300?text=No+Image'}" alt="${product.name}" class="w-full h-48 object-cover">
                <div class="p-5 flex-1 flex flex-col">
                  <h3 class="text-lg font-semibold text-gray-800 mb-2">${product.name}</h3>
                  <p class="text-gray-600 text-sm mb-3 flex-1">${product.description ? product.description.substring(0, 100) + (product.description.length > 100 ? '...' : '') : 'No description available'}</p>
                  <div class="flex items-center justify-between mb-4">
                    <span class="text-2xl font-bold text-brand-600">₹${product.price.toFixed(2)}</span>
                    <span class="text-sm text-gray-500">${product.unit}</span>
                  </div>
                  <button class="add-to-cart-btn w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 px-4 rounded-lg transition-colors"
                          data-product-id="${product._id}">
                    Add to Cart
                  </button>
                </div>
              `;
              productList.appendChild(productCard);
            });

            // Add event listeners for "Add to Cart" buttons
            document.querySelectorAll('.add-to-cart-btn').forEach(button => {
              button.addEventListener('click', async (event) => {
                const btn = event.currentTarget;
                const productId = btn.dataset.productId;
                const quantity = 1;
                const originalText = btn.innerHTML;

                // Loading state
                btn.innerHTML = '<div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mx-auto"></div>';
                btn.disabled = true;

                try {
                  const res = await fetch('/api/buyer/cart', {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'x-auth-token': token
                    },
                    body: JSON.stringify({ productId, quantity })
                  });

                  const data = await res.json();
                  if (res.ok && data.success) {
                    showModal('✅ Product added to cart!', 'success');
                    btn.innerHTML = '<span>✔️</span> Added';
                    setTimeout(() => {
                      btn.innerHTML = originalText;
                      btn.disabled = false;
                    }, 2000);
                  } else {
                    showModal('❌ Failed to add: ' + (data.message || 'Unknown error'), 'error');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                  }
                } catch (err) {
                  console.error('Error adding to cart:', err);
                  showModal('Error adding product to cart.', 'error');
                  btn.innerHTML = originalText;
                  btn.disabled = false;
                }
              });
            });
          } else {
            showModal('Failed to load products: ' + (result.message || 'Unknown error'), 'error');
          }
        } catch (err) {
          console.error('Error loading products:', err);
          showModal('Error fetching products.', 'error');
        }
      }

      // Debounce function for search
      function debounce(func, wait) {
        let timeout;
        return function (...args) {
          clearTimeout(timeout);
          timeout = setTimeout(() => func.apply(this, args), wait);
        };
      }

      searchInput.addEventListener('input', debounce(loadProducts, 500));
      categoryFilter.addEventListener('change', loadProducts);
      sortFilter.addEventListener('change', loadProducts);

      loadProducts();

      // Logout functionality
      document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = '/login';
      });
    });
  </script>

</body>

</html>
