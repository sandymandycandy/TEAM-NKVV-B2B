<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy Products - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
  <style>
    /* Styles for the modal */
    .modal {
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: #fefefe;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      text-align: center;
    }
    .modal-content.success {
      background-color: #d1e7dd;
      color: #0f5132;
    }
    .modal-content.error {
      background-color: #f8d7da;
      color: #842029;
    }
  </style>
</head>
<body class="bg-gray-100 font-[Inter]">

  <!-- Message Modal -->
  <div id="message-modal" class="modal">
    <div id="message-modal-content" class="modal-content">
      <p id="modal-message"></p>
      <button class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-md" onclick="closeModal()">Close</button>
    </div>
  </div>

  <div class="flex min-h-screen">

    <aside class="w-64 bg-white shadow-lg border-r">
      <div class="p-6">
        <h2 class="text-2xl font-bold text-green-700">DASHBOARD</h2>
        <p class="text-sm text-gray-500">Buyer</p>
      </div>
      <nav class="flex flex-col px-4 space-y-2 text-gray-700">
        <a href="/buyer-dashboard" class="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-100">
          🏠 Home
        </a>
        <a href="/buyer/products" class="flex items-center gap-2 p-2 rounded-lg bg-blue-600 text-white font-semibold">
          🛍️ Products
        </a>
        <a href="/buyer/cart" class="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-100">
          🛒 My Cart
        </a>
        <a href="/buyer/profile" class="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-100">
          👤 Profile
        </a>
        <a href="/buyer/history" class="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-100">
          🔖 History
        </a>
        <a href="/buyer/chat" class="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-100">
          💬 Chat
        </a>
      </nav>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">

      <div class="bg-white rounded-lg shadow-md p-6">

        <div class="flex flex-col md:flex-row md:items-center justify-between mb-6">
          <h2 class="text-3xl font-bold text-gray-800 mb-4 md:mb-0">🛍️ Buy Products</h2>
          <input
            type="text"
            placeholder="🔍 Search for products, sellers..."
            class="border rounded-md px-4 py-2 w-full md:w-1/3 focus:outline-none focus:ring-2 focus:ring-blue-400"
          />
        </div>

        <div class="flex flex-wrap gap-4 mb-6">
          <select class="border px-3 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400">
            <option>All Categories</option>
            <option>Grains</option>
            <option>Oils</option>
            <option>Beverages</option>
            <option>Snacks</option>
          </select>

          <select class="border px-3 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400">
            <option>Sort by</option>
            <option>Price: Low to High</option>
            <option>Price: High to Low</option>
            <option>Top Rated</option>
            <option>Newest</option>
          </select>
        </div>

        <!-- Dynamic Product Grid -->
        <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Products will be injected here -->
        </div>

      </div>

    </main>
  </div>

<script>
// Message Modal Functions
const modal = document.getElementById('message-modal');
const modalMessage = document.getElementById('modal-message');
const modalContent = document.getElementById('message-modal-content');

function showModal(message, type) {
    modalMessage.textContent = message;
    modalContent.className = 'modal-content ' + type;
    modal.style.display = 'flex';
}

function closeModal() {
    modal.style.display = 'none';
}

document.addEventListener('DOMContentLoaded', async () => {
  const token = localStorage.getItem('token');
  if (!token) {
    showModal('Please log in first.', 'error');
    setTimeout(() => window.location.href = '/login', 2000);
    return;
  }

  try {
    const response = await fetch('/api/buyer/products', {
      headers: { 'x-auth-token': token } // Corrected header
    });
    const result = await response.json();

    if (response.ok && result.success) {
      const container = document.getElementById('product-list');
      container.innerHTML = '';

      if (result.data.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center col-span-full">No products are available at the moment.</p>';
        return;
      }

      result.data.forEach(product => {
        const card = document.createElement('div');
        card.className = 'p-4 bg-white rounded shadow hover:shadow-lg transition';
        card.innerHTML = `
          <h3 class="font-bold text-lg">${product.name}</h3>
          <p class="text-sm text-gray-500">${product.description}</p>
          <p class="mt-2 text-green-600 font-semibold">₹${product.price} / ${product.unit}</p>
          <div class="mt-2">
            <input type="number" min="1" value="1" class="quantity-input border rounded px-2 py-1 w-16" />
          </div>
          <div class="mt-4 flex justify-center">
            <button data-product-id="${product._id}" class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg add-to-cart">
              Add to Cart
            </button>
          </div>
        `;
        container.appendChild(card);
      });

      // Add event listeners for all "Add to Cart" buttons
      document.querySelectorAll('.add-to-cart').forEach(button => {
        button.addEventListener('click', async (e) => {
          const productId = e.target.getAttribute('data-product-id');
          const card = e.target.closest('.p-4');
          const quantity = parseInt(card.querySelector('.quantity-input').value, 10) || 1;

          try {
            const res = await fetch('/api/buyer/cart', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-auth-token': token // Corrected header
              },
              body: JSON.stringify({ productId, quantity })
            });

            const data = await res.json();
            if (res.ok && data.success) {
              showModal('✅ Product added to cart!', 'success');
            } else {
              showModal('❌ Failed to add: ' + (data.message || 'Unknown error'), 'error');
            }
          } catch (err) {
            console.error('Error adding to cart:', err);
            showModal('Error adding product to cart.', 'error');
          }
        });
      });
    } else {
      showModal('Failed to load products: ' + (result.message || 'Unknown error'), 'error');
    }
  } catch (err) {
    console.error('Error loading products:', err);
    showModal('Error fetching products.', 'error');
  }
});
</script>


</body>
</html>
