<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Inventory - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Styles for the modal */
    .modal {
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #fefefe;
      padding: 24px;
      border-radius: 16px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      transform: scale(0.95);
      transition: transform 0.2s;
    }

    .modal.show .modal-content {
      transform: scale(1);
    }

    .modal-content.success {
      border-left: 4px solid #10b981;
    }

    .modal-content.error {
      border-left: 4px solid #ef4444;
    }

    /* Highlight style for low stock product */
    .highlight {
      border: 2px solid #ef4444;
      box-shadow: 0 0 10px #f87171;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }
  </style>
</head>

<body class="bg-gray-50 font-sans text-gray-900">

  <!-- Message Modal -->
  <div id="message-modal" class="modal">
    <div id="message-modal-content" class="modal-content">
      <h3 id="modal-title" class="text-lg font-bold mb-2">Notification</h3>
      <p id="modal-message" class="text-gray-600 mb-6"></p>
      <button
        class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 px-4 rounded-lg transition-colors"
        onclick="closeModal()">Close</button>
    </div>
  </div>

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside
      class="w-64 bg-white border-r border-gray-200 flex flex-col fixed h-full z-10 transition-transform duration-300 ease-in-out transform -translate-x-full md:translate-x-0"
      id="sidebar">
      <div class="p-6 border-b border-gray-100">
        <h1 class="text-2xl font-bold text-brand-600 tracking-tight">DASHBOARD</h1>
        <p class="text-sm text-gray-500 mt-1">Vendor Portal</p>
      </div>

      <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
        <a href="/vendor-dashboard"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">🏠</span> Home
        </a>
        <a href="/vendor/products"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">📦</span> My Products
        </a>
        <a href="/vendor/inventory"
          class="flex items-center px-4 py-3 text-brand-700 bg-brand-50 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">📥</span> Inventory
        </a>
        <a href="/vendor/orders"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">🛒</span> Orders
        </a>
        <a href="/vendor/profile"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">👤</span> Profile
        </a>
        <a href="/vendor/notifications"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">🔔</span> Notifications
        </a>
        <a href="/vendor/chat"
          class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-brand-600 rounded-lg font-medium transition-colors">
          <span class="mr-3 text-xl">💬</span> Chat
        </a>
      </nav>

      <div class="p-4 border-t border-gray-100">
        <button id="logout-btn"
          class="w-full flex items-center justify-center px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 hover:text-red-700 rounded-lg font-medium transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Log Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 md:ml-64 p-8 transition-all duration-300">
      <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-8">
          <div>
            <h2 class="text-2xl font-bold text-gray-800">Inventory Management</h2>
            <p class="text-gray-500">Monitor your product stock and expiry details.</p>
          </div>
          <a href="/vendor/add-product"
            class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg font-medium transition-colors shadow-sm flex items-center gap-2">
            <span>➕</span> Add Stock
          </a>
        </div>

        <!-- Inventory List -->
        <div id="inventoryList" class="space-y-4">
          <div class="p-12 text-center text-gray-500">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-brand-600 mx-auto mb-4">
            </div>
            <p>Loading inventory...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Message Modal Functions
    const modal = document.getElementById('message-modal');
    const modalMessage = document.getElementById('modal-message');
    const modalTitle = document.getElementById('modal-title');
    const modalContent = document.getElementById('message-modal-content');

    function showModal(message, type) {
      modalMessage.textContent = message;
      if (type === 'success') {
        modalTitle.textContent = 'Success';
        modalTitle.className = 'text-lg font-bold mb-2 text-green-600';
        modalContent.className = 'modal-content success';
      } else {
        modalTitle.textContent = 'Error';
        modalTitle.className = 'text-lg font-bold mb-2 text-red-600';
        modalContent.className = 'modal-content error';
      }
      modal.style.display = 'flex';
      setTimeout(() => {
        modal.classList.add('show');
      }, 10);
    }

    function closeModal() {
      modal.classList.remove('show');
      setTimeout(() => {
        modal.style.display = 'none';
      }, 200);
    }

    function editProduct(productId) {
      // Save product ID in localStorage so the edit page can retrieve it
      localStorage.setItem('editProductId', productId);
      window.location.href = '/vendor/add-product';
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login';
        return;
      }

      try {
        const response = await fetch('/api/vendor/inventory', {
          method: 'GET',
          headers: { 'x-auth-token': token }
        });

        if (response.ok) {
          const result = await response.json();
          const inventoryContainer = document.getElementById('inventoryList');
          inventoryContainer.innerHTML = '';

          if (result.success && result.data.length > 0) {
            result.data.forEach(product => {
              const card = document.createElement('div');
              card.id = `product-${product._id}`;
              card.className = 'bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col md:flex-row items-start md:items-center justify-between gap-6 hover:shadow-md transition-all';

              const isLowStock = product.stock <= 10;

              card.innerHTML = `
<div class="flex items-center gap-4">
    <div class="w-16 h-16 bg-gray-100 rounded-lg flex items-center justify-center text-2xl">📦</div>
    <div>
        <h3 class="font-bold text-lg text-gray-800">${product.name}</h3>
        <p class="text-sm text-gray-500">${product.category}</p>
        <p class="font-semibold mt-1 text-brand-600">₹${product.price}/${product.unit}</p>
    </div>
</div>

<div class="flex flex-col md:flex-row items-start md:items-center gap-8 w-full md:w-auto">
    <div class="text-left md:text-center">
        <p class="text-xs text-gray-500 uppercase font-semibold tracking-wide">Stock</p>
        <p class="${isLowStock ? 'text-red-600' : 'text-green-600'} font-bold text-xl">${product.stock}</p>
        ${isLowStock ? '<span class="text-xs text-red-500 font-medium">Low Stock!</span>' : ''}
    </div>
    <div class="text-left md:text-center">
        <p class="text-xs text-gray-500 uppercase font-semibold tracking-wide">Expiry Date</p>
        <p class="text-gray-800 font-medium">${product.expiryDate || 'N/A'}</p>
    </div>
    <button onclick="editProduct('${product._id}')" class="w-full md:w-auto bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2 px-6 rounded-lg transition-colors shadow-sm">
        Edit
    </button>
</div>
`;
              inventoryContainer.appendChild(card);
            });

            // Highlight a specific product if a 'highlight' query parameter exists
            const urlParams = new URLSearchParams(window.location.search);
            const productIdToHighlight = urlParams.get('highlight');
            if (productIdToHighlight) {
              const productCard = document.getElementById(`product-${productIdToHighlight}`);
              if (productCard) {
                productCard.classList.add('highlight');
                productCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
              }
            }

          } else {
            inventoryContainer.innerHTML = `
<div class="p-12 text-center text-gray-500">
<div class="text-6xl mb-4">📦</div>
<h3 class="text-xl font-medium text-gray-900">No products in inventory</h3>
<p class="mt-2">Add products to start tracking stock.</p>
<a href="/vendor/add-product" class="inline-block mt-4 text-brand-600 hover:text-brand-700 font-medium hover:underline">Add Product</a>
</div>
`;
          }
        } else {
          console.error('API failed');
          showModal('Failed to load inventory.', 'error');
        }
      } catch (err) {
        console.error('Error loading inventory:', err);
        showModal('Could not load inventory due to a network error.', 'error');
      }

      // Logout functionality
      document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = '/login';
      });
    });
  </script>
</body>

</html>
